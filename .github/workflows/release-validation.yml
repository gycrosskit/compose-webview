name: Release validation
on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable Maven release tag
        required: true
        type: string
concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  JAVA_TOOL_OPTIONS: -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security
  VERSION: ${{ github.event.release.tag_name || inputs.version || '0.2.0-rc.9' }}
# 同一 job 的两轮 consumer 复用 daemon，保留成功 DNS 缓存。
jobs:
  release-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
      - run: bash scripts/verify-release.sh
      - run: bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-consumer "-PwebViewVersion=$VERSION" -PremoteOnly assembleDebug verifyNoCompose verifyExactComponentVersion --refresh-dependencies --daemon --max-workers=1 --stacktrace --info
      - run: bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-consumer "-PwebViewVersion=$VERSION" -PremoteOnly -PverifyCmp=true -PverifyNavigation=${{ github.event.release.tag_name == '0.2.0-rc.12' || inputs.version == '0.2.0-rc.12' }} assembleDebug verifyNoKuikly verifyExactComponentVersion --daemon --max-workers=1 --stacktrace --info
  release-native:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
      - run: bash scripts/verify-release.sh
      - run: bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-consumer "-PwebViewVersion=$VERSION" -PremoteOnly compileKotlinIosArm64 compileKotlinIosSimulatorArm64 compileKotlinIosX64 compileKotlinOhosArm64 --refresh-dependencies --daemon --max-workers=1 --stacktrace --info
      - run: |
          ios_framework_target=IosSimulatorArm64
          if [[ "$(uname -m)" != arm64 ]]; then ios_framework_target=IosX64; fi
          bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-consumer "-PwebViewVersion=$VERSION" -PremoteOnly -PverifyCmp=true -PverifyNavigation=${{ github.event.release.tag_name == '0.2.0-rc.12' || inputs.version == '0.2.0-rc.12' }} "linkDebugFramework$ios_framework_target" compileKotlinIosArm64 compileKotlinIosX64 --daemon --max-workers=1 --stacktrace --info
