name: Release validation
on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable Maven release tag
        required: true
        type: string
      verify_fullscreen_controls:
        description: Verify the new fullscreen controls APIs in the selected published version
        required: false
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CI_FORK_HOST_FALLBACK_IP: ${{ vars.CI_FORK_HOST_FALLBACK_IP }}
  JAVA_TOOL_OPTIONS: -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=60000
  VERSION: ${{ github.event.release.tag_name || inputs.version }}
  KUIKLY_COMPOSE_FLAGS: ${{ (inputs.verify_fullscreen_controls || github.event.release.tag_name == '0.2.0-rc.14' || inputs.version == '0.2.0-rc.14' || github.event.release.tag_name == '0.2.0-rc.15' || inputs.version == '0.2.0-rc.15' || github.event.release.tag_name == '0.2.0-rc.16' || inputs.version == '0.2.0-rc.16' || github.event.release.tag_name == '0.2.0-rc.17' || inputs.version == '0.2.0-rc.17' || github.event.release.tag_name == '0.2.0-rc.18' || inputs.version == '0.2.0-rc.18') && '-PverifyKuiklyCompose' || '' }}
  FULLSCREEN_CONTROLS_FLAGS: ${{ (inputs.verify_fullscreen_controls || github.event.release.tag_name == '0.2.0-rc.18' || inputs.version == '0.2.0-rc.18') && '-PverifyFullscreenControls' || '' }}
# 同一 job 的两轮 consumer 复用 daemon，保留成功 DNS 缓存。
jobs:
  verify-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
      CI_DIAGNOSTICS_DIR: ${{ github.workspace }}/ci-diagnostics
      VERIFY_OHOS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Check exact frozen archive and public publications once
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        timeout-minutes: 30
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/verify-public.log -- bash scripts/verify-release.sh
      - if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        run: echo 'Public artifact validation runs for Release or an explicit version dispatch.'
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  release-android:
    if: always()
    needs: verify-public
    runs-on: ubuntu-24.04
    env:
      # 此 runner 的镜像路由不可达；保留原域名 TLS 和制品坐标，限定 IPv4 socket。
      JAVA_TOOL_OPTIONS: -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security -Djava.net.preferIPv4Stack=true -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=60000
    timeout-minutes: 60
    steps:
      - name: Require successful public verification
        run: |
          test "${{ needs.verify-public.result }}" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-android.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-consumer "-PwebViewVersion=$VERSION" -PremoteOnly $KUIKLY_COMPOSE_FLAGS $FULLSCREEN_CONTROLS_FLAGS -PverifyPageChannels=${{ github.event.release.tag_name == '0.2.0-rc.13' || inputs.version == '0.2.0-rc.13' || github.event.release.tag_name == '0.2.0-rc.14' || inputs.version == '0.2.0-rc.14' || github.event.release.tag_name == '0.2.0-rc.15' || inputs.version == '0.2.0-rc.15' || github.event.release.tag_name == '0.2.0-rc.16' || inputs.version == '0.2.0-rc.16' || github.event.release.tag_name == '0.2.0-rc.17' || inputs.version == '0.2.0-rc.17' || github.event.release.tag_name == '0.2.0-rc.18' || inputs.version == '0.2.0-rc.18' }} assembleDebug verifyNoCmpUi verifyExactComponentVersion --refresh-dependencies --daemon --max-workers=1 --stacktrace --info
        timeout-minutes: 35
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-android.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-consumer "-PwebViewVersion=$VERSION" -PremoteOnly -PverifyPageChannels=${{ github.event.release.tag_name == '0.2.0-rc.13' || inputs.version == '0.2.0-rc.13' || github.event.release.tag_name == '0.2.0-rc.14' || inputs.version == '0.2.0-rc.14' || github.event.release.tag_name == '0.2.0-rc.15' || inputs.version == '0.2.0-rc.15' || github.event.release.tag_name == '0.2.0-rc.16' || inputs.version == '0.2.0-rc.16' || github.event.release.tag_name == '0.2.0-rc.17' || inputs.version == '0.2.0-rc.17' || github.event.release.tag_name == '0.2.0-rc.18' || inputs.version == '0.2.0-rc.18' }} -PverifyCmp=true -PverifyNavigation=${{ github.event.release.tag_name == '0.2.0-rc.12' || inputs.version == '0.2.0-rc.12' || github.event.release.tag_name == '0.2.0-rc.13' || inputs.version == '0.2.0-rc.13' || github.event.release.tag_name == '0.2.0-rc.14' || inputs.version == '0.2.0-rc.14' || github.event.release.tag_name == '0.2.0-rc.15' || inputs.version == '0.2.0-rc.15' || github.event.release.tag_name == '0.2.0-rc.16' || inputs.version == '0.2.0-rc.16' || github.event.release.tag_name == '0.2.0-rc.17' || inputs.version == '0.2.0-rc.17' || github.event.release.tag_name == '0.2.0-rc.18' || inputs.version == '0.2.0-rc.18' }} assembleDebug verifyNoKuikly verifyExactComponentVersion --daemon --max-workers=1 --stacktrace --info
        timeout-minutes: 35
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - name: Explain lightweight completion
        if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        run: echo 'No build is required for this event and scope.'
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  release-native:
    if: always()
    needs: verify-public
    runs-on: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - name: Require successful public verification
        run: |
          test "${{ needs.verify-public.result }}" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Identify Native toolchain and Xcode
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        id: native-key
        run: python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - name: Restore completed Kotlin Native toolchain
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        id: konan
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.native-key.outputs.key }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - name: Build exact remote Git Pod and pinned Renderer
        if: github.event.release.tag_name == '0.2.0-rc.17' || inputs.version == '0.2.0-rc.17' || github.event.release.tag_name == '0.2.0-rc.18' || inputs.version == '0.2.0-rc.18'
        timeout-minutes: 20
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-pod.log -- bash scripts/ci-build-kuikly-render.sh "$RUNNER_TEMP/webview-release-render" GYWebView compose-webview "$VERSION"
      - name: Verify remote Pod checkout receipt
        if: github.event.release.tag_name == '0.2.0-rc.17' || inputs.version == '0.2.0-rc.17' || github.event.release.tag_name == '0.2.0-rc.18' || inputs.version == '0.2.0-rc.18'
        timeout-minutes: 5
        run: |
          mkdir -p ci-diagnostics
          cp "$RUNNER_TEMP/webview-release-render/Podfile.lock" ci-diagnostics/release-Podfile.lock.txt
          tag_refs="$(git ls-remote --tags https://github.com/gycrosskit/compose-webview.git "refs/tags/$VERSION" "refs/tags/$VERSION^{}")"
          REMOTE_TAG_COMMIT="$(printf '%s\n' "$tag_refs" | awk '$2 ~ /\^\{\}$/ {peeled=$1} {plain=$1} END {print peeled ? peeled : plain}')"
          export REMOTE_TAG_COMMIT
          git clone --depth 1 --single-branch --branch "$VERSION" https://github.com/gycrosskit/compose-webview.git "$RUNNER_TEMP/webview-release-source"
          test "$(git -C "$RUNNER_TEMP/webview-release-source" rev-parse HEAD)" = "$REMOTE_TAG_COMMIT"
          ruby -ryaml -rjson -rdigest - <<'RUBY'
          lock = YAML.safe_load(File.read('ci-diagnostics/release-Podfile.lock.txt'), permitted_classes: [Symbol])
          checkout = lock.fetch('CHECKOUT OPTIONS').fetch('GYWebView')
          expected = ENV.fetch('REMOTE_TAG_COMMIT')
          abort 'Git Pod checkout does not match the immutable tag' unless expected.match?(/\A[0-9a-f]{40}\z/) && checkout.fetch(:tag) == ENV.fetch('VERSION') && checkout.fetch(:git) == 'https://github.com/gycrosskit/compose-webview.git'
          abort 'Git Pod package version does not match the release' unless lock.fetch('PODS').any? { |pod| pod.is_a?(Hash) && pod.key?("GYWebView (#{ENV.fetch('VERSION')})") }
          reference = File.join(ENV.fetch('RUNNER_TEMP'), 'webview-release-source/ios/Sources')
          installed = File.join(ENV.fetch('RUNNER_TEMP'), 'webview-release-render/Pods/GYWebView/ios/Sources')
          manifests = [reference, installed].map do |directory|
            Dir.chdir(directory) { Dir.glob('**/*.{h,m,inc}').sort.to_h { |path| [path, Digest::SHA256.file(path).hexdigest] } }
          end
          abort 'Installed Git Pod native source differs from the resolved tag' if manifests.first.empty? || manifests.first != manifests.last
          receipt = { version: ENV.fetch('VERSION'), resolved_tag_sha: expected, lock_tag: checkout.fetch(:tag), native_source_sha256: manifests.first, configuration: 'Debug', renderer_version: '2.28.0', evidence: 'CocoaPods tag/version, native source bytes and Simulator framework build' }
          File.write('ci-diagnostics/release-pod.json', JSON.pretty_generate(receipt) + "\n")
          RUBY
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-native.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-consumer "-PwebViewVersion=$VERSION" -PremoteOnly $KUIKLY_COMPOSE_FLAGS $FULLSCREEN_CONTROLS_FLAGS -PverifyPageChannels=${{ github.event.release.tag_name == '0.2.0-rc.13' || inputs.version == '0.2.0-rc.13' || github.event.release.tag_name == '0.2.0-rc.14' || inputs.version == '0.2.0-rc.14' || github.event.release.tag_name == '0.2.0-rc.15' || inputs.version == '0.2.0-rc.15' || github.event.release.tag_name == '0.2.0-rc.16' || inputs.version == '0.2.0-rc.16' || github.event.release.tag_name == '0.2.0-rc.17' || inputs.version == '0.2.0-rc.17' || github.event.release.tag_name == '0.2.0-rc.18' || inputs.version == '0.2.0-rc.18' }} compileKotlinIosArm64 compileKotlinIosSimulatorArm64 compileKotlinIosX64 compileKotlinOhosArm64 --refresh-dependencies --daemon --max-workers=1 --stacktrace --info
        timeout-minutes: 45
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - name: Link new Kuikly fullscreen APIs with the real Renderer
        if: github.event.release.tag_name == '0.2.0-rc.18' || inputs.version == '0.2.0-rc.18'
        timeout-minutes: 30
        run: |
          ios_framework_target=IosSimulatorArm64
          if [[ "$(uname -m)" != arm64 ]]; then ios_framework_target=IosX64; fi
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-kuikly-link.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-consumer "-PwebViewVersion=$VERSION" -PremoteOnly $KUIKLY_COMPOSE_FLAGS $FULLSCREEN_CONTROLS_FLAGS -PverifyPageChannels=true "-PsimRenderFrameworkDir=$RUNNER_TEMP/webview-release-render/Products" "linkDebugFramework$ios_framework_target" --daemon --max-workers=1 --stacktrace --info
      - timeout-minutes: 45
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        run: |
          ios_framework_target=IosSimulatorArm64
          if [[ "$(uname -m)" != arm64 ]]; then ios_framework_target=IosX64; fi
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-native.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-consumer "-PwebViewVersion=$VERSION" -PremoteOnly -PverifyPageChannels=${{ github.event.release.tag_name == '0.2.0-rc.13' || inputs.version == '0.2.0-rc.13' || github.event.release.tag_name == '0.2.0-rc.14' || inputs.version == '0.2.0-rc.14' || github.event.release.tag_name == '0.2.0-rc.15' || inputs.version == '0.2.0-rc.15' || github.event.release.tag_name == '0.2.0-rc.16' || inputs.version == '0.2.0-rc.16' || github.event.release.tag_name == '0.2.0-rc.17' || inputs.version == '0.2.0-rc.17' || github.event.release.tag_name == '0.2.0-rc.18' || inputs.version == '0.2.0-rc.18' }} -PverifyCmp=true -PverifyNavigation=${{ github.event.release.tag_name == '0.2.0-rc.12' || inputs.version == '0.2.0-rc.12' || github.event.release.tag_name == '0.2.0-rc.13' || inputs.version == '0.2.0-rc.13' || github.event.release.tag_name == '0.2.0-rc.14' || inputs.version == '0.2.0-rc.14' || github.event.release.tag_name == '0.2.0-rc.15' || inputs.version == '0.2.0-rc.15' || github.event.release.tag_name == '0.2.0-rc.16' || inputs.version == '0.2.0-rc.16' || github.event.release.tag_name == '0.2.0-rc.17' || inputs.version == '0.2.0-rc.17' || github.event.release.tag_name == '0.2.0-rc.18' || inputs.version == '0.2.0-rc.18' }} "linkDebugFramework$ios_framework_target" compileKotlinIosArm64 compileKotlinIosX64 --daemon --max-workers=1 --stacktrace --info
      - name: Explain lightweight completion
        if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        run: echo 'No build is required for this event and scope.'
      - name: Cache only successful Native downloads
        if: success() && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
