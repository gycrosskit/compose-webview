name: Release validation
on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable Maven release tag
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CI_FORK_HOST_FALLBACK_IP: ${{ vars.CI_FORK_HOST_FALLBACK_IP }}
  JAVA_TOOL_OPTIONS: -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=60000
  VERSION: ${{ github.event.release.tag_name || inputs.version }}
  KUIKLY_COMPOSE_FLAGS: ${{ (github.event.release.tag_name == '0.2.0-rc.14' || inputs.version == '0.2.0-rc.14' || github.event.release.tag_name == '0.2.0-rc.15' || inputs.version == '0.2.0-rc.15') && '-PverifyKuiklyCompose' || '' }}
# 同一 job 的两轮 consumer 复用 daemon，保留成功 DNS 缓存。
jobs:
  verify-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
      CI_DIAGNOSTICS_DIR: ${{ github.workspace }}/ci-diagnostics
      VERIFY_OHOS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check exact frozen archive and public publications once
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        timeout-minutes: 30
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/verify-public.log -- bash scripts/verify-release.sh
      - if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        run: echo 'Public artifact validation runs for Release or an explicit version dispatch.'
      - name: Record job completion
        if: always()
        run: |
          mkdir -p ci-diagnostics
          printf 'job=%s\nstatus=%s\n' "$GITHUB_JOB" "${{ job.status }}" > "ci-diagnostics/$GITHUB_JOB.txt"
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  release-android:
    if: always()
    needs: verify-public
    runs-on: ubuntu-24.04
    env:
      # 此 runner 的镜像路由不可达；保留原域名 TLS 和制品坐标，限定 IPv4 socket。
      JAVA_TOOL_OPTIONS: -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security -Djava.net.preferIPv4Stack=true -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=60000
    timeout-minutes: 60
    steps:
      - name: Require successful public verification
        run: |
          test "${{ needs.verify-public.result }}" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-android.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-consumer "-PwebViewVersion=$VERSION" -PremoteOnly $KUIKLY_COMPOSE_FLAGS -PverifyPageChannels=${{ github.event.release.tag_name == '0.2.0-rc.13' || inputs.version == '0.2.0-rc.13' || github.event.release.tag_name == '0.2.0-rc.14' || inputs.version == '0.2.0-rc.14' || github.event.release.tag_name == '0.2.0-rc.15' || inputs.version == '0.2.0-rc.15' }} assembleDebug verifyNoCmpUi verifyExactComponentVersion --refresh-dependencies --daemon --max-workers=1 --stacktrace --info
        timeout-minutes: 35
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-android.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-consumer "-PwebViewVersion=$VERSION" -PremoteOnly -PverifyPageChannels=${{ github.event.release.tag_name == '0.2.0-rc.13' || inputs.version == '0.2.0-rc.13' || github.event.release.tag_name == '0.2.0-rc.14' || inputs.version == '0.2.0-rc.14' || github.event.release.tag_name == '0.2.0-rc.15' || inputs.version == '0.2.0-rc.15' }} -PverifyCmp=true -PverifyNavigation=${{ github.event.release.tag_name == '0.2.0-rc.12' || inputs.version == '0.2.0-rc.12' || github.event.release.tag_name == '0.2.0-rc.13' || inputs.version == '0.2.0-rc.13' || github.event.release.tag_name == '0.2.0-rc.14' || inputs.version == '0.2.0-rc.14' || github.event.release.tag_name == '0.2.0-rc.15' || inputs.version == '0.2.0-rc.15' }} assembleDebug verifyNoKuikly verifyExactComponentVersion --daemon --max-workers=1 --stacktrace --info
        timeout-minutes: 35
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - name: Explain lightweight completion
        if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        run: echo 'No build is required for this event and scope.'
      - name: Record job completion
        if: always()
        run: |
          mkdir -p ci-diagnostics
          printf 'job=%s\nstatus=%s\n' "$GITHUB_JOB" "${{ job.status }}" > "ci-diagnostics/$GITHUB_JOB.txt"
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
  release-native:
    if: always()
    needs: verify-public
    runs-on: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - name: Require successful public verification
        run: |
          test "${{ needs.verify-public.result }}" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Identify Native toolchain and Xcode
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        id: native-key
        run: python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - name: Restore completed Kotlin Native toolchain
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        id: konan
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.native-key.outputs.key }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-native.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-consumer "-PwebViewVersion=$VERSION" -PremoteOnly $KUIKLY_COMPOSE_FLAGS -PverifyPageChannels=${{ github.event.release.tag_name == '0.2.0-rc.13' || inputs.version == '0.2.0-rc.13' || github.event.release.tag_name == '0.2.0-rc.14' || inputs.version == '0.2.0-rc.14' || github.event.release.tag_name == '0.2.0-rc.15' || inputs.version == '0.2.0-rc.15' }} compileKotlinIosArm64 compileKotlinIosSimulatorArm64 compileKotlinIosX64 compileKotlinOhosArm64 --refresh-dependencies --daemon --max-workers=1 --stacktrace --info
        timeout-minutes: 45
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
      - timeout-minutes: 45
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        run: |
          ios_framework_target=IosSimulatorArm64
          if [[ "$(uname -m)" != arm64 ]]; then ios_framework_target=IosX64; fi
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/release-native.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" -p verification-consumer "-PwebViewVersion=$VERSION" -PremoteOnly -PverifyPageChannels=${{ github.event.release.tag_name == '0.2.0-rc.13' || inputs.version == '0.2.0-rc.13' || github.event.release.tag_name == '0.2.0-rc.14' || inputs.version == '0.2.0-rc.14' || github.event.release.tag_name == '0.2.0-rc.15' || inputs.version == '0.2.0-rc.15' }} -PverifyCmp=true -PverifyNavigation=${{ github.event.release.tag_name == '0.2.0-rc.12' || inputs.version == '0.2.0-rc.12' || github.event.release.tag_name == '0.2.0-rc.13' || inputs.version == '0.2.0-rc.13' || github.event.release.tag_name == '0.2.0-rc.14' || inputs.version == '0.2.0-rc.14' || github.event.release.tag_name == '0.2.0-rc.15' || inputs.version == '0.2.0-rc.15' }} "linkDebugFramework$ios_framework_target" compileKotlinIosArm64 compileKotlinIosX64 --daemon --max-workers=1 --stacktrace --info
      - name: Explain lightweight completion
        if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) }}
        run: echo 'No build is required for this event and scope.'
      - name: Cache only successful Native downloads
        if: success() && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Record job completion
        if: always()
        run: |
          mkdir -p ci-diagnostics
          printf 'job=%s\nstatus=%s\n' "$GITHUB_JOB" "${{ job.status }}" > "ci-diagnostics/$GITHUB_JOB.txt"
      - name: Save public CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-diagnostics/**/*.log
            ci-diagnostics/**/*.json
            ci-diagnostics/**/*.jsonl
            ci-diagnostics/**/*.txt
            **/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7
