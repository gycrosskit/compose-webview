name: Source regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_maven:
        description: Package the candidate Maven archive after source checks
        type: boolean
        default: false
      warm_native_cache:
        description: Warm Native toolchains on main only (leave version empty)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI_FORK_HOST_FALLBACK_IP: ${{ vars.CI_FORK_HOST_FALLBACK_IP }}
  JAVA_TOOL_OPTIONS: -Djava.security.properties=${{ github.workspace }}/scripts/ci-java.security -Dsun.net.client.defaultConnectTimeout=30000 -Dsun.net.client.defaultReadTimeout=60000
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.scope.outputs.source }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Reject packaging during cache warmup
        env:
          PACKAGE_MAVEN: ${{ inputs.package_maven }}
          WARM_NATIVE_CACHE: ${{ inputs.warm_native_cache }}
        run: |
          if [[ "$PACKAGE_MAVEN" == true && "$WARM_NATIVE_CACHE" == true ]]; then
            echo 'Maven packaging requires source checks, not cache warmup.' >&2
            exit 1
          fi
      - id: scope
        run: python3 scripts/ci-changes.py
      - name: Record source scope
        env:
          PACKAGE_MAVEN: ${{ inputs.package_maven }}
          SOURCE_SCOPE: ${{ steps.scope.outputs.source }}
        run: |
          if [[ "$PACKAGE_MAVEN" == true ]]; then test "$SOURCE_SCOPE" = true; fi
          mkdir -p ci-diagnostics
          printf 'event=%s\nsource=%s\n' "$GITHUB_EVENT_NAME" "${{ steps.scope.outputs.source }}" > ci-diagnostics/scope.txt
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  contracts:
    if: always()
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful scope detection
        run: test "${{ needs.changes.result }}" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.source == 'true'
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/contract-tools" --ignore-scripts --no-audit --no-fund typescript@4.9.5
        timeout-minutes: 5
        if: needs.changes.outputs.source == 'true'
      - timeout-minutes: 8
        if: needs.changes.outputs.source == 'true'
        run: |
          python3 -c 'import json, pathlib; assert json.loads(pathlib.Path("ohos/webview-native/oh-package.json5").read_text())["dependencies"]["@gycrosskit/system-actions-native"] == "0.2.0-rc.4", "Update the frozen HAR dependency with its declared version"'
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/system-actions.har" https://github.com/gycrosskit/system-actions/releases/download/0.2.0-rc.4/SystemActionsNative.har
          printf '%s  %s\n' e87ea317422d5f41e796e07f9b9fb30b195f3ef616486b5ab3890962e32648ae "$RUNNER_TEMP/system-actions.har" | shasum -a 256 --check
          python3 -c 'import pathlib, sys, tarfile; archive=tarfile.open(sys.argv[1]); member=archive.getmember("package/src/main/ets/WindowPolicy.ets"); assert member.isfile(); pathlib.Path(sys.argv[2]).write_bytes(archive.extractfile(member).read()); archive.close()' "$RUNNER_TEMP/system-actions.har" "$RUNNER_TEMP/window-policy.ets"
      - timeout-minutes: 8
        if: needs.changes.outputs.source == 'true'
        run: |
          python3 verification/ci/test_fork_host.py
          python3 verification/ci/test_ios_wire_policy.py
          python3 verification/ci/test_release_archive_policy.py
          python3 verification/publication/test_maven_check.py
          python3 verification/publication/test_metadata.py
          python3 ios/generate-scripts.py --check
          TYPESCRIPT_PATH="$RUNNER_TEMP/contract-tools/node_modules/typescript" WEBVIEW_WINDOW_POLICY_SOURCE="$RUNNER_TEMP/window-policy.ets" node ohos/tests/contract.test.cjs
      - name: Explain lightweight completion
        if: ${{ !(needs.changes.outputs.source == 'true') }}
        run: echo 'No build is required for this event and scope.'
      - name: Check CI shell syntax
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/ci-python-cache" python3 -m py_compile scripts/ci-changes.py scripts/ci-run.py
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  android:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: needs.changes.outputs.source == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: needs.changes.outputs.source == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.source == 'true'
        with:
          node-version: '22'
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/android.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" testDebugUnitTest :webview-core:testDebugUnitTest :webview-kuikly:testDebugUnitTest compileReleaseKotlinAndroid :webview-kuikly:compileReleaseKotlinAndroid --no-daemon --max-workers=1 --stacktrace --info
        timeout-minutes: 35
        if: needs.changes.outputs.source == 'true'
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/android.log -- bash verification/android-callbacks/verify.sh
        timeout-minutes: 10
        if: needs.changes.outputs.source == 'true'
      - run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/android.log -- bash verification/early-scripts/verify.sh
        timeout-minutes: 10
        if: needs.changes.outputs.source == 'true'
      - name: Explain lightweight completion
        if: ${{ !(needs.changes.outputs.source == 'true') }}
        run: echo 'No build is required for this event and scope.'
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
  native:
    needs: changes
    runs-on: ${{ ((needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')) && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.package_maven && 90 || 60 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install shared CI tools
        uses: gycrosskit/.github/actions/ci-tools@607ff44db144c68fc6523de38c04aac29e427b68
      - name: Identify Native toolchain and Xcode
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        id: native-key
        run: python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - name: Restore completed Kotlin Native toolchain
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        id: konan
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.native-key.outputs.key }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/ci-pin-fork-host.sh
        timeout-minutes: 3
        if: (needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')
      - timeout-minutes: 45
        if: needs.changes.outputs.source == 'true'
        run: |
          ios_test_target=iosSimulatorArm64Test
          if [[ "$(uname -m)" != arm64 ]]; then ios_test_target=iosX64Test; fi
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native.log -- bash gradlew --init-script "$PWD/scripts/ci-repositories.gradle" "$ios_test_target" :webview-core:"$ios_test_target" compileKotlinIosArm64 compileKotlinIosX64 :webview-kuikly:compileKotlinIosArm64 :webview-kuikly:compileKotlinIosSimulatorArm64 :webview-kuikly:compileKotlinIosX64 :webview-core:compileKotlinOhosArm64 :webview-kuikly:compileKotlinOhosArm64 --no-daemon --max-workers=1 --stacktrace --info
          python3 -c 'import pathlib, sys, xml.etree.ElementTree as ET; files=pathlib.Path(".").glob("**/build/test-results/"+sys.argv[1]+"/*.xml"); cases=[case for path in files for case in ET.parse(path).iter("testcase")]; assert any(case.find("skipped") is None for case in cases), "No executed iOS test cases"' "$ios_test_target"
      - name: Verify real iOS wire in Debug and Release
        timeout-minutes: 30
        if: needs.changes.outputs.source == 'true'
        run: |
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/ios-render.log -- bash scripts/ci-build-kuikly-render.sh "$RUNNER_TEMP/webview-wire-render"
          export WEBVIEW_IOS_SIMULATOR_RENDER_FRAMEWORK_DIR="$RUNNER_TEMP/webview-wire-render/Products"
          WEBVIEW_SIMULATOR="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime, group in devices.items() if "iOS-" in runtime and tuple(map(int, runtime.split("iOS-")[1].split("-"))) >= (16, 4) for device in group if device["name"].startswith("iPhone")))')"
          export WEBVIEW_SIMULATOR
          xcrun simctl bootstatus "$WEBVIEW_SIMULATOR" -b
          WEBVIEW_DEBUG_BUILD=0 python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/ios-wire-release.log -- bash scripts/verify-ios-wire.sh
          WEBVIEW_DEBUG_BUILD=1 python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/ios-wire-debug.log -- bash scripts/verify-ios-wire.sh
      - name: Package checked Maven archive
        if: github.event_name == 'workflow_dispatch' && inputs.package_maven && needs.changes.outputs.source == 'true'
        timeout-minutes: 30
        run: |
          python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/package-maven.log -- bash scripts/package-maven.sh --init-script "$PWD/scripts/ci-repositories.gradle" --stacktrace --info
          (cd build && shasum -a 256 compose-webview-maven.tar.gz > SHA256SUMS)
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          module = next(Path('build/maven/com/github/gycrosskit/compose-webview/compose-webview').glob('*/*.module'))
          archive = Path('build/compose-webview-maven.tar.gz')
          receipt = {
              'version': json.loads(module.read_text())['component']['version'],
              'source_sha': os.environ['GITHUB_SHA'],
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
          }
          Path('build/maven-provenance.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYTHON
      - name: Save candidate Maven archive
        if: github.event_name == 'workflow_dispatch' && inputs.package_maven && needs.changes.outputs.source == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-webview-maven-${{ github.sha }}
          path: |
            build/compose-webview-maven.tar.gz
            build/SHA256SUMS
            build/maven-provenance.json
          if-no-files-found: error
          retention-days: 7
      - name: Explain lightweight completion
        if: ${{ !(needs.changes.outputs.source == 'true') }}
        run: echo 'No build is required for this event and scope.'
      - name: Warm trusted main Native cache
        if: (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main') && steps.konan.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: python3 scripts/ci-run.py --no-progress-seconds 300 --log ci-diagnostics/native-warmup.log -- python3 scripts/ci-native-cache.py
      - name: Cache only successful Native downloads
        if: success() && ((needs.changes.outputs.source == 'true') || (github.event_name == 'workflow_dispatch' && inputs.warm_native_cache && github.ref == 'refs/heads/main')) && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Save public CI diagnostics
        if: always()
        uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        with:
          status: ${{ job.status }}
