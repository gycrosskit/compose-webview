name: Package release candidate
'on':
  push:
    branches: ['codex/kuikly-rc-*']
    paths: ['.github/workflows/package-release.yml', 'scripts/package-maven.sh', 'scripts/archive-prebuilt.sh', 'build.gradle.kts', 'gradle.properties']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  maven:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: '0.3.0-rc.1'
      GROUP: 'com.github.gycrosskit.compose-webview'
      CI_FORK_HOST_FALLBACK_IP: ${{ vars.CI_FORK_HOST_FALLBACK_IP }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Load pinned build helpers
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: gycrosskit/.github
          ref: 607ff44db144c68fc6523de38c04aac29e427b68
          path: .ci-shared
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true
      - name: Configure remote build dependencies
        run: |
          printf 'networkaddress.cache.ttl=3600\nnetworkaddress.cache.negative.ttl=0\n' > "$RUNNER_TEMP/ci-java.security"
          echo "JAVA_TOOL_OPTIONS=-Djava.security.properties=$RUNNER_TEMP/ci-java.security" >> "$GITHUB_ENV"
          bash .ci-shared/templates/ci-pin-fork-host.sh
      - name: Identify Native toolchain
        id: native-key
        run: |
          test -e scripts/ci-native-cache.py || install -m 0755 .ci-shared/templates/ci-native-cache.py scripts/ci-native-cache.py
          python3 scripts/ci-native-cache.py --key >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/dependencies
            !~/.konan/dependencies/cache
            !~/.konan/**/*.part
            !~/.konan/**/*.tmp
            !~/.konan/**/*.lock
          key: ${{ steps.native-key.outputs.key }}
      - name: Build and verify exact Maven archive
        run: python3 .ci-shared/templates/ci-run.py --log ci-diagnostics/package.log -- bash scripts/package-maven.sh
      - name: Freeze archive receipt
        env:
          ARCHIVE: build/compose-webview-maven.tar.gz
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, shutil, subprocess, tarfile
          from pathlib import Path
          source = Path(os.path.expandvars(os.environ['ARCHIVE']))
          assert source.is_file(), source
          output = Path('build/rc-artifacts')
          assert not output.exists(), output
          output.mkdir(parents=True)
          archive = output / 'compose-webview-maven.tar.gz'
          shutil.copyfile(source, archive)
          with tarfile.open(archive) as bundle:
              for member in bundle.getmembers():
                  assert member.isfile() or member.isdir(), member.name
                  assert '..' not in Path(member.name).parts and not Path(member.name).is_absolute(), member.name
                  assert not Path(member.name).name.startswith('._'), member.name
          sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          (output / 'SHA256SUMS').write_text(f'{sha}  {archive.name}\n')
          receipt = {'repository': os.environ['GITHUB_REPOSITORY'], 'version': os.environ['VERSION'],
                     'source_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                     'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
                     'archive': archive.name, 'sha256': sha}
          assert receipt['source_sha'] == os.environ['GITHUB_SHA']
          assert not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], text=True)
          (output / 'source-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-archive-${{ github.sha }}
          path: build/rc-artifacts/
          if-no-files-found: error
          retention-days: 14
      - uses: gycrosskit/.github/actions/ci-diagnostics@607ff44db144c68fc6523de38c04aac29e427b68
        if: always()
        with:
          status: ${{ job.status }}
