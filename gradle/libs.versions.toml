[versions]
agp = "8.10.1"
kotlin = "2.2.21-1.0.0"
ktor = "3.3.3-1.1.0-04"
activity = "1.13.0"
webkit = "1.16.0"
junit = "4.13.2"

kuikly = "2.28.0-2.0.21-ohos"
serialization = "1.9.1-1.0.0"

[libraries]
kuikly-compose = { module = "com.tencent.kuikly-open:compose", version.ref = "kuikly" }
kuikly-core = { module = "com.tencent.kuikly-open:core", version.ref = "kuikly" }
kuikly-render-android = { module = "com.tencent.kuikly-open:core-render-android", version.ref = "kuikly" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-http = { module = "io.ktor:ktor-http", version.ref = "ktor" }
activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
