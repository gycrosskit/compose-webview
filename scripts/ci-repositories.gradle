// 依赖缓存可能让首次 DNS 推迟到测试阶段；只在下载前有限重试域名解析，不重跑测试。
def ciDnsHost = 'maven.eazytec-cloud.com'
println "CI DNS cache: positive=${java.security.Security.getProperty('networkaddress.cache.ttl')}, negative=${java.security.Security.getProperty('networkaddress.cache.negative.ttl')}"
for (int attempt = 1; attempt <= 3; attempt++) {
    try {
        def addresses = java.net.InetAddress.getAllByName(ciDnsHost)
        println "CI DNS resolved ${ciDnsHost}: ${addresses.length} addresses (attempt ${attempt})"
        break
    } catch (java.net.UnknownHostException failure) {
        println "CI DNS lookup failed for ${ciDnsHost} (attempt ${attempt}/3): ${failure.message}"
        // 预解析失败不能阻断已有缓存；真实依赖解析仍由 Gradle 决定成败。
        if (attempt == 3) break
        Thread.sleep(1000)
    }
}

// GitHub-hosted runner 访问公开仓库；避免国内镜像 502 阻断 Gradle 的官方仓库解析。
gradle.settingsEvaluated { settings ->
    [settings.pluginManagement.repositories, settings.dependencyResolutionManagement.repositories].each { repositories ->
        repositories.removeAll { it instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository && it.url.host == 'maven.aliyun.com' }
        // Eazytec 只有部分上游 classifier；普通 AGP/AAPT 等必须从官方仓库完整解析。
        repositories.withType(org.gradle.api.artifacts.repositories.MavenArtifactRepository).matching { it.url.host == 'maven.eazytec-cloud.com' }.all {
            content { includeVersionByRegex('.*', '.*', '.*-(1\\.0\\.0|1\\.1\\.0-04)') }
        }
    }
}
